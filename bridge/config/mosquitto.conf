# Broker local : comptes séparés et ACL par sujet (§9). Créez les comptes avec :
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd zigbee2mqtt
#   docker compose exec mosquitto mosquitto_passwd /mosquitto/data/passwd homeassistant
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
