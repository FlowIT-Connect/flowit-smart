<!DOCTYPE html>
<!-- Déclaration des formulaires pour Netlify Forms (envoi des demandes par e-mail).
     Jamais affiché : le site envoie ici une copie de chaque demande déjà validée et enregistrée. -->
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaires</title></head>
<body>
<form name="solea-gateway" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="email"><input name="pays"><input name="langue"><input name="infos_commerciales"><input name="page_langue">
</form>
<form name="solea-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="prenom"><input name="nom"><input name="email"><input name="telephone"><input name="pays"><input name="type_projet"><textarea name="message"></textarea><input name="infos_commerciales"><input name="page_langue">
</form>
<form name="solea-partenaire" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="nom"><input name="societe"><input name="activite"><input name="email"><input name="telephone"><input name="pays"><textarea name="message"></textarea><input name="infos_commerciales"><input name="page_langue">
</form>
</body></html>
