# Module complémentaire Home Assistant « Solea Boîtier vidéo » : le boîtier vidéo (caméras,
# visiophones, micro, orientation, carte mémoire) sur la box, pour pouvoir éteindre le PC.
# Le relais vidéo MediaMTX tourne dans le même module, sans port ouvert sur Internet.
name: Solea Boîtier vidéo
version: "1.0.2"
slug: solea_video
description: Caméras et visiophones dans Solea depuis la box (le PC peut rester éteint)
url: https://github.com/flowit-connect/flowit-smart
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Réseau de la box : recherche des caméras sur le Wi-Fi (diffusion UDP) et vidéo WebRTC.
host_network: true
options:
  mode: video
  service_role_key: ""
  integration_id: ""
  supabase_url: https://qhzlmzfdbajulnymrwvg.supabase.co
  log_level: info
schema:
  mode: list(video)
  service_role_key: password
  integration_id: str
  supabase_url: url
  log_level: list(debug|info|warn|error)
  video_subnets: str?
  talk_gain: float(1,10)?
