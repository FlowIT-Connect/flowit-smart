# Compile l'app Android (APK) de Solea : ouverture des serrures TTLock en Bluetooth.
# Le fichier Solea.apk se télécharge dans l'onglet Actions du dépôt (connecté à GitHub),
# en bas de la page de l'exécution, rubrique « Artifacts ».
name: Construire l'app Android

on:
  push:
    branches: [main, claude/project-thread-sdqxxm]
    paths: ["app/**", ".github/workflows/build-android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Solea-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
