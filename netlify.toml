# Netlify : héberge le site international (dossier site/) sur solea-dz.com.
# L'application Flutter reste sur app.solea-dz.com (GitHub Pages).
[build]
  base = "site"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Adaptateur Next.js de Netlify (pages serveur, proxy des langues, formulaires).
# Sans lui, Netlify publie le dossier .next comme de simples fichiers et répond « Page not found ».
[[plugins]]
  package = "@netlify/plugin-nextjs"
