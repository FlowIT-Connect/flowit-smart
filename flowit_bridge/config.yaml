# Module complémentaire Home Assistant « FlowIT Bridge » / passerelle Solea : la passerelle
# bridge/ empaquetée pour s'installer en quelques clics sur la box, sans Docker ni PC allumé.
name: FlowIT Bridge
version: "2.2.1"
slug: flowit_bridge
description: Passerelle Solea sur la box (Smart Life, TTLock, robot yeedi, Broadlink) ou relie Home Assistant à Solea
url: https://github.com/flowit-connect/flowit-smart
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
# Lecture seule : touches apprises des télécommandes Broadlink (.storage/broadlink_remote_*_codes).
map:
  - type: homeassistant_config
    read_only: true
services:
  - mqtt:want
options:
  mode: home_assistant
  service_role_key: ""
  integration_id: ""
  supabase_url: https://qhzlmzfdbajulnymrwvg.supabase.co
  run_automations: true
  log_level: info
  ha_mqtt: true
schema:
  mode: list(home_assistant|tuya_cloud|simulator)
  service_role_key: password
  integration_id: str
  supabase_url: url
  simulator: bool?
  run_automations: bool
  log_level: list(debug|info|warn|error)
  entity_filter: str?
  ha_mqtt: bool
  ha_integrations: str?
  tuya_access_id: str?
  tuya_access_secret: password?
  tuya_region: list(eu|weu|us|eus|cn|in)?
  ttlock_client_id: str?
  ttlock_client_secret: password?
  ttlock_username: str?
  ttlock_password_md5: password?
  yeedi_email: str?
  yeedi_password_md5: password?
  yeedi_country: str?
  yeedi_domain: str?
